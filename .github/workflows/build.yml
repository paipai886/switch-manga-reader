name: Build NRO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure helper tools (idempotent)
        run: |
          pacman -Sy --noconfirm curl unzip git || true

      - name: Restore binary assets from upstream zip
        run: |
          set -e
          curl -fsSL -o /tmp/upstream.zip https://codeload.github.com/gomprime/mangadex-reader/zip/refs/heads/master
          unzip -q /tmp/upstream.zip -d /tmp/upstream
          UP=/tmp/upstream/mangadex-reader-master
          mkdir -p external
          cp -r "$UP/external/curl-mbedtls" external/
          cp "$UP/external/cacert.pem" external/cacert.pem
          cp "$UP/external/json.hpp" external/json.hpp
          mkdir -p romfs
          cp "$UP/romfs/cacert.pem" romfs/cacert.pem

      - name: Clone borealis submodule
        run: |
          git clone --depth 1 https://github.com/gomprime/mangadex-reader-borealis.git external/borealis

      - name: Build NRO
        run: |
          set -o pipefail
          make 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload NRO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mangadex-reader
          path: mangadex-reader.nro
